services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_qc_capture_system
      POSTGRES_USER: qc_user
      POSTGRES_PASSWORD: MTSCO
    ports: ["15432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres_data:
