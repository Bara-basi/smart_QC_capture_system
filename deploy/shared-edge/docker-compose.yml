name: mtsco-edge

services:
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
      QC_DOMAIN: ${QC_DOMAIN:?Set QC_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN}
      WEBSITE_DOMAIN: ${WEBSITE_DOMAIN:?Set WEBSITE_DOMAIN}
      WEBSITE_APEX_DOMAIN: ${WEBSITE_APEX_DOMAIN:?Set WEBSITE_APEX_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - edge_data:/data
      - edge_config:/config
    networks:
      - shared
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  edge_data:
  edge_config:

networks:
  shared:
    external: true
    name: qc_capture_system_default
