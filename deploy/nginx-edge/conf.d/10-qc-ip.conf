# Preserve the current public-IP entry point while qc.mtsco.cn waits for ICP.
server {
    listen 80;
    server_name 47.96.9.22;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://47.96.9.22$request_uri;
    }
}

server {
    # This is also the TLS default server so clients that omit SNI for a bare
    # IP still receive the matching IP certificate, as the old Caddy did.
    listen 443 ssl default_server;
    http2 on;
    server_name 47.96.9.22;

    ssl_certificate /etc/nginx/certs/47.96.9.22/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/47.96.9.22/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 100m;

    # Do not serve QC to a request that somehow reached this default server
    # through an unknown hostname or certificate-ignoring client.
    if ($host != "47.96.9.22") {
        return 444;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        set $qc_backend qc-capture-web:80;
        proxy_pass http://$qc_backend;
        include /etc/nginx/snippets/qc-proxy.conf;
    }
}
