# The factory website keeps its existing domain and dynamic admin upstream.
# Only the public HTTP(S) entry changes from Caddy to Nginx.
server {
    listen 80;
    server_name mtalloypiping.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mtalloypiping.com$request_uri;
    }
}

server {
    listen 80;
    server_name www.mtalloypiping.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.mtalloypiping.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mtalloypiping.com;

    ssl_certificate /etc/nginx/certs/mtalloypiping.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/mtalloypiping.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    return 301 https://www.mtalloypiping.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.mtalloypiping.com;

    ssl_certificate /etc/nginx/certs/www.mtalloypiping.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/www.mtalloypiping.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10m;

    location / {
        set $mtalloy_backend mtalloy-website-admin:80;
        proxy_pass http://$mtalloy_backend;
        include /etc/nginx/snippets/mtalloy-proxy.conf;
    }
}
