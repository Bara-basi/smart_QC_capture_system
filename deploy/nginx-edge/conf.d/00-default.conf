# Reject unknown HTTP hosts instead of accidentally routing them to QC.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# Internal health endpoint used by Docker. It is not published on the host.
server {
    listen 127.0.0.1:8080;
    access_log off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
