# Enable this file only after mtsco.cn passes ICP filing, the hostname resolves
# to this server, and Certbot has created the certificate below.
#
# Copy to ../conf.d/30-qc-domain.conf and reload Nginx.
server {
    listen 80;
    server_name qc.mtsco.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://qc.mtsco.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name qc.mtsco.cn;

    ssl_certificate /etc/nginx/certs/qc.mtsco.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/qc.mtsco.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 100m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        set $qc_backend qc-capture-web:80;
        proxy_pass http://$qc_backend;
        include /etc/nginx/snippets/qc-proxy.conf;
    }
}
